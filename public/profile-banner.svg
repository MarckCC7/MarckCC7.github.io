<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Marco Collado C. — The Digital Garden">
  <!--
    Banner animado para el README de perfil de GitHub.

    Se sirve desde el propio sitio (marckcc7.github.io/profile-banner.svg) en
    lugar de usar un generador de terceros: no depende de un servicio que pueda
    caerse o rate-limitarse, y los colores salen de los mismos tokens que la web.

    GitHub sirve las imágenes por su proxy (camo) y las carga como <img>: los
    recursos externos quedan bloqueados, pero el CSS interno sí se ejecuta. Por
    eso todo va embebido y no hay ni una referencia externa.

    OJO con las hojas: en SVG, una regla CSS `transform` SUSTITUYE al atributo
    `transform="rotate(...)"`, no se suma a él. Animar la escala de un elemento
    rotado por atributo le borra la rotación. Por eso cada hoja va envuelta en
    un <g> que carga la rotación, y la animación vive en la elipse de dentro.
  -->
  <defs>
    <linearGradient id="stem" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#245f43"/>
      <stop offset="60%" stop-color="#66b38c"/>
      <stop offset="100%" stop-color="#b8deca"/>
    </linearGradient>

    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fcaac" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#327c58" stop-opacity="0.35"/>
    </linearGradient>

    <radialGradient id="bloomA" cx="18%" cy="8%" r="62%">
      <stop offset="0%" stop-color="#66b38c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#66b38c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bloomB" cx="82%" cy="96%" r="58%">
      <stop offset="0%" stop-color="#5b84fb" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5b84fb" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ecf1ee" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <style>
      /* — El tallo se dibuja de abajo a arriba, en bucle — */
      .stem {
        stroke-dasharray: 200;
        stroke-dashoffset: 200;
        animation: grow 9s ease-in-out infinite;
      }
      @keyframes grow {
        0%       { stroke-dashoffset: 200; }
        32%, 88% { stroke-dashoffset: 0; }
        100%     { stroke-dashoffset: 200; }
      }

      /* — Las hojas brotan una detrás de otra, desde el tallo hacia fuera — */
      .leaf {
        transform-box: fill-box;
        opacity: 0;
        animation: sprout 9s ease-in-out infinite;
      }
      .leaf-l { transform-origin: 100% 50%; }  /* borde interior = derecho */
      .leaf-r { transform-origin: 0% 50%; }    /* borde interior = izquierdo */
      .d1 { animation-delay: 0.6s; }
      .d2 { animation-delay: 1.2s; }
      .d3 { animation-delay: 1.8s; }
      .d4 { animation-delay: 2.4s; }
      @keyframes sprout {
        0%, 6%   { opacity: 0; transform: scale(0.15); }
        20%, 86% { opacity: 1; transform: scale(1); }
        100%     { opacity: 0; transform: scale(0.15); }
      }

      /* — El brote de la copa respira — */
      .bud {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: pulse 4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50%      { opacity: 1;   transform: scale(1.15); }
      }

      /* — Polen subiendo — */
      .mote { animation: drift 7s ease-in-out infinite; }
      .s1 { animation-delay: 0s;   animation-duration: 7s; }
      .s2 { animation-delay: 1.4s; animation-duration: 9s; }
      .s3 { animation-delay: 2.8s; animation-duration: 8s; }
      .s4 { animation-delay: 4.2s; animation-duration: 10s; }
      .s5 { animation-delay: 5.6s; animation-duration: 7.5s; }
      @keyframes drift {
        0%   { opacity: 0;   transform: translateY(16px); }
        30%  { opacity: 0.85; }
        70%  { opacity: 0.45; }
        100% { opacity: 0;   transform: translateY(-38px); }
      }

      /* — El brote pixelado parpadea: el guiño RPG, igual que en la web — */
      .pixel { animation: blink 2.4s steps(1, end) infinite; }
      @keyframes blink {
        0%, 45%  { opacity: 1; }
        50%, 95% { opacity: 0.25; }
        100%     { opacity: 1; }
      }

      /* Quien pide menos movimiento no ve ninguno. */
      @media (prefers-reduced-motion: reduce) {
        .stem  { stroke-dashoffset: 0; animation: none; }
        .leaf  { opacity: 1; transform: none; animation: none; }
        .bud   { opacity: 0.85; animation: none; }
        .mote  { opacity: 0.6; animation: none; }
        .pixel { animation: none; }
      }
    </style>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="320" rx="18" fill="#070908"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#bloomA)"/>
  <rect width="1200" height="320" rx="18" fill="url(#bloomB)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#ecf1ee" stroke-opacity="0.09"/>

  <!-- Texto: mitad izquierda, sin invadir la planta -->
  <g font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="74" y="112" fill="#8fcaac" font-size="15" font-weight="600" letter-spacing="4.5">
      THE DIGITAL GARDEN
    </text>
    <text x="72" y="186" fill="#ecf1ee" font-size="60" font-weight="700" letter-spacing="-1.8">
      Marco Collado C.
    </text>
    <text x="74" y="224" fill="#97a39d" font-size="19">
      Estudiante de Ingeniería de Software
    </text>
    <rect x="74" y="250" width="3" height="30" fill="#66b38c"/>
    <text x="92" y="272" fill="#b8deca" font-size="18" font-weight="500">
      Hazlo con pasión o no lo hagas.
    </text>
  </g>

  <!-- Planta: centrada en x=900, con aire a ambos lados -->
  <g>
    <circle cx="900" cy="196" r="130" fill="none" stroke="#8fcaac" stroke-opacity="0.13" stroke-width="1.5" stroke-dasharray="2 12"/>
    <circle cx="900" cy="196" r="90"  fill="none" stroke="#8fcaac" stroke-opacity="0.1"  stroke-width="1.5" stroke-dasharray="2 9"/>

    <path class="stem" d="M900 288 C900 236 894 178 900 92"
          stroke="url(#stem)" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Cada hoja: el <g> rota, la elipse escala. Ver la nota de arriba. -->
    <g transform="rotate(-24 872 240)">
      <ellipse class="leaf leaf-l d1" cx="872" cy="240" rx="34" ry="13" fill="url(#leaf)"/>
    </g>
    <g transform="rotate(24 928 206)">
      <ellipse class="leaf leaf-r d2" cx="928" cy="206" rx="34" ry="13" fill="url(#leaf)"/>
    </g>
    <g transform="rotate(-28 877 168)">
      <ellipse class="leaf leaf-l d3" cx="877" cy="168" rx="29" ry="11" fill="url(#leaf)"/>
    </g>
    <g transform="rotate(28 923 136)">
      <ellipse class="leaf leaf-r d4" cx="923" cy="136" rx="29" ry="11" fill="url(#leaf)"/>
    </g>

    <circle class="bud" cx="900" cy="92" r="17" fill="#5b84fb" fill-opacity="0.18" stroke="#7a9eff" stroke-width="1.5"/>
    <circle cx="900" cy="92" r="6" fill="#9cbaff"/>

    <path d="M812 290 H988" stroke="#ecf1ee" stroke-opacity="0.12" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Brote pixelado, plantado en la tierra a la izquierda del tallo -->
    <g class="pixel">
      <rect x="828" y="276" width="7" height="14" fill="#45996f"/>
      <rect x="828" y="269" width="7" height="7"  fill="#66b38c"/>
      <rect x="821" y="276" width="7" height="7"  fill="#66b38c"/>
      <rect x="835" y="262" width="7" height="7"  fill="#8fcaac"/>
      <rect x="828" y="262" width="7" height="7"  fill="#b8deca"/>
    </g>
  </g>

  <!-- Polen, repartido por el aire -->
  <g>
    <circle class="mote s1" cx="640"  cy="128" r="2.6" fill="#b8deca"/>
    <circle class="mote s2" cx="712"  cy="228" r="2"   fill="#9cbaff"/>
    <circle class="mote s3" cx="1062" cy="146" r="2.4" fill="#8fcaac"/>
    <circle class="mote s4" cx="1108" cy="242" r="1.8" fill="#7a9eff"/>
    <circle class="mote s5" cx="1140" cy="108" r="2.2" fill="#b8deca"/>
    <circle class="mote s3" cx="596"  cy="256" r="1.8" fill="#8fcaac"/>
  </g>
</svg>
